# =============================================================================
# config/p90.conf — Configuration principale P90 Launcher
#
# ⚠ Ce fichier est chargé par les scripts Bash : il ne contient QUE des
#   affectations de variables (pas de sections [ini], pas de commentaires
#   en fin de ligne).
#
# Les valeurs ci-dessous sont des DÉFAUTS. Les variables d'environnement
# déjà définies ont priorité (voir lib/common.sh).
# =============================================================================

# --- Version et emplacements ---
P90_VERSION="0.1.0"
# Code installé (fixe) ; les données vivent ailleurs, sur la clé USB.
P90_INSTALL_DIR="${P90_INSTALL_DIR:-/opt/p90-launcher}"
P90_DATA_DIR="${P90_DATA_DIR:-${HOME}/.p90-data}"

# --- Source des mises à jour (GitHub — dépôt officiel) ---
# Format attendu : <url capable de servir /raw/branch/main/<fichier> >
# Gitea n'est plus qu'une POC historique : ne pas y pousser.
P90_UPDATE_URL="https://raw.githubusercontent.com/Teacher2X/IPH-P90-CYBER"

# --- Réseau pédagogique ---
NET_SUBNET="192.168.1.0/24"
LAN_PORT_MIN=3000
LAN_PORT_MAX=3050

# --- Ports des modules ---
# Ollama : jamais exposé au LAN (écoute 127.0.0.1 seulement)
P90_OLLAMA_PORT=11434
# OpenWebUI : accès LAN pédagogique autorisé (pare-feu à la charge de l'enseignant)
P90_OPENWEBUI_PORT=3000
# WAHA : strictement local (127.0.0.1), jamais exposé
P90_WAHA_PORT=3001

# --- Limites matérielles ---
MIN_RAM_MB=4096
SUGGESTED_RAM_MB=8192
MIN_DISK_GB=32
MIN_DISK_FREE_GB=5

# --- Choix pédagogique des modèles ---
# Un seul modèle est téléchargé par défaut, choisi selon la RAM.
DEFAULT_MODEL="qwen3:8b"
SUPPORTED_MODELS="qwen3:32b qwen3:8b qwen3:0.5b"
LANGUAGE="fr"

# --- Docker ---
DOCKER_NETWORK="p90-network"
DOCKER_OPENWEBUI_NAME="p90-openwebui"
DOCKER_OLLAMA_NAME="p90-ollama"
DOCKER_WAHA_NAME="p90-waha"

# --- Sécurité (ne pas modifier sans raison pédagogique) ---
EXPOSE_OLLAMA_TO_LAN=false
OPENWEBUI_AUTH=true
WAHA_ENABLED=false

# --- Étapes d'installation (contrôles numérotés, menu commun CLI/YAD) ---
# Une seule source de vérité : les scripts de launcher/. Le menu n'ajoute rien.
P90_CHECK_STEPS=(
    "1|01-usb-persistence.sh|Vérifier la persistance de la clé USB"
    "2|02-install-ollama.sh|Installer et tester Ollama (POC CPU)"
)
